<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能知识库问答</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);height:100vh;display:flex;justify-content:center;align-items:center}
  .card{width:720px;max-width:94vw;height:86vh;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
  .head{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:18px 24px}
  .head h1{font-size:20px;font-weight:600}
  .head p{font-size:13px;opacity:.85;margin-top:3px}
  #chat{flex:1;padding:20px;overflow-y:auto;background:#f7f8fc}
  .msg{display:flex;margin-bottom:16px}
  .bubble{max-width:78%;padding:12px 16px;border-radius:14px;line-height:1.55;font-size:14px;word-break:break-word}
  .user{justify-content:flex-end}
  .user .bubble{background:#667eea;color:#fff;border-bottom-right-radius:4px}
  .bot{justify-content:flex-start}
  .bot .bubble{background:#fff;border:1px solid #e5e7f0;border-bottom-left-radius:4px;color:#222}
  .src{font-size:12px;color:#8a8fa3;margin-top:8px;padding-top:6px;border-top:1px dashed #e0e2ed}
  .src div{margin-top:2px}
  .dot{display:inline-block;width:7px;height:7px;margin:0 2px;background:#764ba2;border-radius:50%;animation:blink 1.4s infinite both}
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  .bar{display:flex;gap:10px;padding:16px;background:#fff;border-top:1px solid #eee}
  input{flex:1;padding:12px 16px;border:1px solid #dde0ea;border-radius:24px;font-size:14px;outline:none;transition:.2s}
  input:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.15)}
  button{padding:12px 24px;border:none;border-radius:24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:14px;cursor:pointer;transition:.2s}
  button:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(102,126,234,.4)}
  button:disabled{opacity:.5;cursor:not-allowed;transform:none}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>📚 智能知识库问答</h1>
    <p>基于 RAG 检索增强生成 · 只回答文档中有的内容</p>
  </div>
  <div id="chat"></div>
  <div class="bar">
    <input id="inp" placeholder="输入你的问题，回车发送..." onkeydown="if(event.key==='Enter')send()">
    <button id="btn" onclick="send()">发送</button>
  </div>
</div>
<script>
let tid = "demo";

function escapeHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function add(text, who, sources){
  const chat = document.getElementById("chat");
  const wrap = document.createElement("div");
  wrap.className = "msg " + who;
  let html = `<div class="bubble">${text}`;
  if (sources && sources.length) {
    html += `<div class="src">引用来源：${sources.map(s=>`<div>📄 ${s}</div>`).join("")}</div>`;
  }
  html += `</div>`;
  wrap.innerHTML = html;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

async function send(){
  const inp = document.getElementById("inp");
  const btn = document.getElementById("btn");
  const q = inp.value.trim(); if (!q) return;
  add(escapeHtml(q), "user"); inp.value = "";
  btn.disabled = true;
  add(`<span class="dot"></span><span class="dot"></span><span class="dot"></span>`, "bot");
  try {
    // 相对路径：跟页面同源，自动跟随当前端口，不再担心端口不一致
    const res = await fetch("/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({thread_id: tid, question: q})
    });
    const data = await res.json();
    const chat = document.getElementById("chat");
    chat.removeChild(chat.lastChild);
    add(escapeHtml(data.answer), "bot", data.sources);
  } catch(e) {
    const chat = document.getElementById("chat");
    chat.removeChild(chat.lastChild);
    add("⚠️ 请求失败，请确认后端服务已启动", "bot");
  }
  btn.disabled = false;
}
</script>
</body>
</html>
